---
layout: default
---
{% assign sections = site.sections | sort: "order" %}

<header class="hero">
  <h1>{{ site.name }}<span>.</span></h1>
  <p class="tagline">{{ site.tagline }}</p>
</header>

<ul class="index">
  {% for s in sections %}
  <li>
    <a href="{{ s.url | relative_url }}">
      <span class="num">{{ forloop.index | prepend: '0' | slice: -2, 2 }}</span>
      <span class="t">{{ s.title }}</span>
      {% if s.summary %}<span class="s">{{ s.summary }}</span>{% endif %}
      <span class="arrow">→</span>
    </a>
  </li>
  {% endfor %}
</ul>
